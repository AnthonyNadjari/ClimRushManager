services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: climrush
      POSTGRES_PASSWORD: climrush
      POSTGRES_DB: climrush
    volumes:
      - climrush_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climrush -d climrush"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  climrush_pg:
